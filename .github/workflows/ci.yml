name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        description: Optional public HTTPS API origin for an unsigned Windows installer
        type: string
        default: ""
      rtc_url:
        description: Matching public WSS LiveKit origin (required with api_url)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  typescript-postgres:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run check:ts
      - run: bun run test:coverage
      - run: bun run test:binary
      - run: bun run test:persistence
      - run: bun --bun node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:media
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: typescript-coverage-and-e2e
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn
  portable-rust:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: bun run check:rust
  windows-desktop:
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: bun install --frozen-lockfile
      - name: Install the pinned browser for Windows media fixtures
        run: bun --bun node_modules/@playwright/test/cli.js install chromium
      - name: Verify the owned Windows SFU and synthetic publisher before native compilation
        timeout-minutes: 5
        run: bun scripts/test-desktop-receiver.ts --publisher-only
      - name: Restore Windows Rust dependencies and build outputs
        id: windows-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: bun run check:rust
      - name: Check the opt-in Windows media proof and SDK
        run: cargo clippy --locked -p ss-media-proof --features native-proof --all-targets -- -D warnings
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Test native grant and shutdown guards
        run: cargo test --locked -p ss-rtc-livekit --features native-proof --lib
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Test Windows acquisition framing and owned watchdog
        run: cargo test --locked -p ss-media-windows --features probe-ui
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Test Windows private key ACLs and publisher pacing
        run: cargo test --locked -p ss-media-proof --features native-proof
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Build the complete experimental Windows publisher
        run: cargo build --locked -p ss-media-proof --features native-proof
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Save the experimental publisher for authorized hardware testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-media-proof-development-unsigned
          path: target/debug/ss-media-proof.exe
          if-no-files-found: error
          retention-days: 7
      - run: bun run --filter @screen-share/contracts typecheck
      - run: bun run --filter @screen-share/desktop build
      - name: Prepare the fixed native publisher sidecar
        run: bun scripts/build-sidecar.ts
      - name: Strictly check the packaged Windows parent and native command boundaries
        run: cargo clippy --locked -p screen-share-desktop --all-targets -- -D warnings
        env:
          CARGO_BUILD_JOBS: 2
      - run: cargo check --locked -p screen-share-desktop --all-targets
        env:
          CARGO_BUILD_JOBS: 2
      - run: cargo test --locked -p screen-share-desktop --lib
        env:
          CARGO_BUILD_JOBS: 2
      - name: Validate manually configured public endpoints
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          BUILD_API_URL: ${{ inputs.api_url }}
          BUILD_RTC_URL: ${{ inputs.rtc_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:BUILD_API_URL -and !$env:BUILD_RTC_URL) { exit 0 }
          foreach ($entry in @(@($env:BUILD_API_URL, 'https'), @($env:BUILD_RTC_URL, 'wss'))) {
            $url = $null
            if (![Uri]::TryCreate($entry[0], [UriKind]::Absolute, [ref]$url) -or
                $url.Scheme -ne $entry[1] -or $url.UserInfo -or $url.Query -or
                $url.Fragment -or $url.AbsolutePath -ne '/' -or $url.IsLoopback) {
              throw 'Both endpoints must be public HTTPS/WSS origins without credentials, paths or query strings.'
            }
          }
      - run: bun run build:desktop
        env:
          SCREEN_SHARE_API_URL: ${{ inputs.api_url || 'http://127.0.0.1:3000' }}
          SCREEN_SHARE_RTC_URL: ${{ inputs.rtc_url || 'ws://127.0.0.1:7880' }}
      - name: Verify and record the configured Windows installation
        if: github.event_name == 'workflow_dispatch' && inputs.api_url != ''
        shell: pwsh
        env:
          BUILD_API_URL: ${{ inputs.api_url }}
          BUILD_RTC_URL: ${{ inputs.rtc_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('target/release/screen-share-desktop.exe'))
          foreach ($origin in @($env:BUILD_API_URL, $env:BUILD_RTC_URL)) {
            if (!$binary.Contains($origin)) { throw 'Configured public origin is absent from the application executable.' }
          }
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one fresh NSIS installer.' }
          [ordered]@{
            revision = $env:GITHUB_SHA
            api_url = $env:BUILD_API_URL
            rtc_url = $env:BUILD_RTC_URL
            installer = $installers[0].Name
            sha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            signed = $false
          } | ConvertTo-Json | Set-Content target/release/bundle/nsis/build-info.json
      - name: Preserve completed Windows compilation before media runtime testing
        if: steps.windows-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.api_url != '' && 'desktop-windows-configured-unsigned' || 'desktop-windows-development-unsigned' }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/build-info.json
          if-no-files-found: error
      - name: Test encrypted reception in the actual Windows application
        run: bun scripts/test-desktop-receiver.ts
        env:
          CARGO_BUILD_JOBS: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: desktop-receiver-failure-diagnostics
          path: test-results/desktop-receiver/
          if-no-files-found: warn
  compose-image:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun run bootstrap
      - run: docker compose --env-file .env -f infra/compose.yaml --profile app config --quiet
      - run: bun run stack:up
      - run: docker compose --env-file .env -f infra/compose.yaml exec -T control-api /app/control-api smoke
      - name: Verify the standalone API image runtime
        run: |
          docker compose --env-file .env -f infra/compose.yaml exec -T control-api sh -eu -c '
            test "$(id -u)" = 10001
            test -s /etc/ssl/certs/ca-certificates.crt
            test ! -d /app/node_modules
            test ! -e /app/.env
            ! command -v node >/dev/null 2>&1
          '
      - name: Build and inspect the production viewer image without deploying it
        shell: bash
        run: |
          set -euo pipefail
          image=ss-product-web-check:ci
          container=ss-ci-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          directory=$(mktemp -d)
          cleanup() {
            docker rm -fv "$container" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf "$directory"
          }
          trap cleanup EXIT
          limits=()
          if [[ "$(docker build --help)" == *"--resource"* ]]; then
            limits=(--resource memory=512m --resource cpu-quota=100000)
          fi
          docker build "${limits[@]}" --build-arg PUBLIC_API_URL=https://share.example.org -f infra/production/Dockerfile -t "$image" .
          docker run --rm --network none --cpus 1 --memory 128m --cap-drop ALL --read-only --entrypoint sh "$image" -eu -c '
            test "$(id -u)" = 10001
            test -s /etc/ssl/certs/ca-certificates.crt
            test -f /srv/viewer/index.html
            test ! -d /srv/viewer/node_modules
            test ! -d /usr/local/lib/node_modules
            ! command -v node >/dev/null 2>&1
            ! command -v bun >/dev/null 2>&1
          '
          docker run --rm --network none --cpus 1 --memory 128m --cap-drop ALL --read-only \
            --env SITE_HOST=share.example.org --env RTC_HOST=rtc.example.org --env ACME_EMAIL=operator@example.org \
            "$image" caddy adapt --config /etc/caddy/Caddyfile > /dev/null
          docker create --name "$container" "$image" > /dev/null
          docker cp "$container:/srv/viewer" "$directory/viewer"
          WEB_DIST="$directory/viewer" bun --no-env-file - <<'TS'
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { resolve } from 'node:path';
          const secretNames = new Set(['POSTGRES_PASSWORD', 'AUTH_SECRET', 'LIVEKIT_API_KEY', 'LIVEKIT_API_SECRET']);
          const secrets: string[] = [];
          for (const line of readFileSync('.env', 'utf8').split(/\r?\n/)) {
            const separator = line.indexOf('=');
            if (!secretNames.has(line.slice(0, separator))) continue;
            let value = line.slice(separator + 1).trim();
            if (value.startsWith('"')) value = JSON.parse(value);
            else if (value.startsWith("'")) value = value.slice(1, -1);
            if (value.length < 12) throw new Error('Missing generated CI credential');
            secrets.push(value);
          }
          if (secrets.length !== secretNames.size || !process.env.WEB_DIST) throw new Error('Image scan prerequisites are missing');
          let files = 0;
          let publicOriginFound = false;
          for (const name of readdirSync(process.env.WEB_DIST, { recursive: true, encoding: 'utf8' })) {
            const path = resolve(process.env.WEB_DIST, name);
            if (!statSync(path).isFile()) continue;
            if (name.split(/[\\/]/).some((part) => part === '.env' || part === 'node_modules') || /\.(?:pem|key)$/.test(name)) throw new Error('Private configuration appeared in the static image');
            const content = readFileSync(path);
            if (secrets.some((secret) => content.includes(secret))) throw new Error('A server credential was embedded in the static image');
            publicOriginFound ||= content.includes('https://share.example.org');
            files++;
          }
          if (files === 0 || !publicOriginFound) throw new Error('Expected public frontend configuration is absent');
          console.log(`Inspected ${files} static image files; server credentials are absent.`);
          TS
      - if: always()
        run: bun run stack:down
