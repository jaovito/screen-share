name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  typescript-postgres:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run check:ts
      - run: bun run test:coverage
      - run: bun run test:binary
      - run: bun run test:persistence
      - run: bun --bun node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:media
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: typescript-coverage-and-e2e
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn
  portable-rust:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: bun run check:rust
  windows-desktop:
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: bun install --frozen-lockfile
      - run: bun run check:rust
      - name: Check the opt-in Windows media proof and SDK
        run: cargo clippy --locked -p ss-media-proof --features native-proof --all-targets -- -D warnings
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Test native grants, cleanup, pacing and private key file ACLs
        run: |
          cargo test --locked -p ss-rtc-livekit --features native-proof --lib
          cargo test --locked -p ss-media-windows --features probe-ui
          cargo test --locked -p ss-media-proof --features native-proof
          cargo build --locked -p ss-media-proof --features native-proof
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -C target-feature=+crt-static
      - run: bun run --filter @screen-share/contracts typecheck
      - run: bun run --filter @screen-share/desktop build
      - run: cargo check --locked -p screen-share-desktop --all-targets
      - run: cargo test --locked -p screen-share-desktop --lib
      - run: bun run build:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-development-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
  compose-image:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun run bootstrap
      - run: docker compose --env-file .env -f infra/compose.yaml --profile app config --quiet
      - run: bun run stack:up
      - run: docker compose --env-file .env -f infra/compose.yaml exec -T control-api /app/control-api smoke
      - if: always()
        run: bun run stack:down
