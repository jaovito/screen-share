name: Bug report
description: Report a reproducible problem in implemented behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting link in SECURITY.md. Do not include credentials or personal media."
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands, inputs, and a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, Bun/Rust/Docker versions, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or screenshots without secrets or personal content.
