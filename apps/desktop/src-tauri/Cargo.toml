[package]
name = "screen-share-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "screen_share_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-updater = "=2.14.0"
updater-http = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
base64 = "=0.23.1"
minisign-verify = "=0.3.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
tokio = { version = "=1.54.1", features = ["time", "sync"] }
serde.workspace = true
serde_json.workspace = true
ss-control-client.workspace = true
ss-media-proof = { path = "../../media-proof-native", default-features = false }
ss-domain.workspace = true
ss-application.workspace = true
ss-media-windows.workspace = true
ss-rtc-livekit.workspace = true


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
